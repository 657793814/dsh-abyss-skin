<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH SKIN LAB — preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    background: #151517;
    color: #e9ecf2;
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #232324;
    --dsw-alias-bg-layer-2: #292929;
    --dsw-specific-sidebar-fill: #1b1b1c;
    --dsw-specific-input-major: #232324;
    --dsw-specific-bubble: #292929;
    --dsw-alias-border-l1: #ffffff0f;
    --dsw-alias-border-l2: #ffffff1f;
    --dsw-alias-label-primary: #f5f5f5;
    --dsw-alias-label-secondary: #d4d4d4;
    --dsw-alias-label-tertiary: #a2a4a6;
    --dsw-alias-label-caption: #81858c;
    --dsw-alias-brand-primary: #f5f5f5;
    --dsw-alias-link: #7aaaff;
    overflow: hidden;
  }
  .app { display: flex; height: 100%; }
  .sidebar {
    width: 248px; flex: 0 0 248px; display: flex; flex-direction: column; gap: 4px;
    padding: 14px 12px; background: var(--dsw-specific-sidebar-fill);
    border-right: 1px solid var(--dsw-alias-border-l1);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px 16px; font-weight: 600; letter-spacing: .01em; }
  .brand-logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(145deg,#f7f9ff,#b8c4d8); display: grid; place-items: center; color:#151517; font-size: 13px; }
  .brand small { font-size: 8px; letter-spacing: .12em; padding: 2px 4px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 3px; color: var(--dsw-alias-label-tertiary); }
  .nav { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; color: var(--dsw-alias-label-secondary); font-size: 13px; }
  .nav.active { background: var(--dsw-specific-sidebar-nav-item-active, #ffffff14); color: var(--dsw-alias-label-primary); }
  .nav .ico { width: 16px; text-align: center; opacity: .75; }
  .newchat { margin-bottom: 10px; border: 1px solid var(--dsw-alias-border-l2); justify-content: center; color: var(--dsw-alias-label-primary); }
  .section { margin: 18px 8px 6px; font-size: 11px; color: var(--dsw-alias-label-caption); display: flex; justify-content: space-between; }
  .chat-item { display: flex; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--dsw-alias-label-secondary); }
  .chat-item.active { background: rgba(255,255,255,.07); color: var(--dsw-alias-label-primary); }
  .chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 9px 8px; font-size: 12px; color: var(--dsw-alias-label-tertiary); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(140deg,#4d93f8,#8f6bff); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .topbar .title { font-size: 13px; color: var(--dsw-alias-label-secondary); }
  .topbar .actions { display: flex; gap: 14px; color: var(--dsw-alias-label-tertiary); font-size: 14px; }
  .thread { flex: 1; overflow: hidden; padding: 42px clamp(32px, 7vw, 120px) 20px; }
  .thread-inner { max-width: 820px; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dsw-alias-label-caption); margin-bottom: 14px; }
  h1 { margin: 0 0 12px; font-size: clamp(26px, 3vw, 40px); font-weight: 500; letter-spacing: -.02em; }
  .lede { margin: 0 0 34px; color: var(--dsw-alias-label-tertiary); font-size: 14px; line-height: 1.8; max-width: 640px; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; max-width: 700px; }
  .card {
    padding: 16px 18px; border-radius: 12px; background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l1); font-size: 13px; color: var(--dsw-alias-label-secondary);
  }
  .card b { display: block; margin-bottom: 6px; color: var(--dsw-alias-label-primary); font-weight: 500; }
  .composer-wrap { padding: 0 clamp(32px, 7vw, 120px) 26px; }
  .composer {
    max-width: 820px; margin: 0 auto; border-radius: 16px; padding: 12px 14px 10px;
    background: var(--dsw-specific-input-major); border: 1px solid var(--dsw-alias-border-l2);
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
  }
  .composer .ph { color: var(--dsw-alias-label-caption); font-size: 14px; padding: 2px 2px 18px; }
  .composer .row { display: flex; align-items: center; justify-content: space-between; color: var(--dsw-alias-label-caption); font-size: 12px; }
  .send { width: 28px; height: 28px; border-radius: 50%; background: #f5f5f5; color: #151517; display: grid; place-items: center; font-size: 14px; }
  .modal {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.42);
  }
  .modal-card {
    width: min(600px, 80vw); padding: 28px 30px; border-radius: 14px;
    background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l2);
    box-shadow: 0 24px 80px rgba(0,0,0,.5); font-size: 13px; line-height: 1.8; color: var(--dsw-alias-label-secondary);
  }
  .modal-card h2 { margin: 0 0 12px; font-size: 19px; color: var(--dsw-alias-label-primary); font-weight: 500; }
  .modal-card button { margin-top: 18px; float: right; padding: 7px 20px; border-radius: 8px; border: 0; background: #f5f5f5; color: #151517; font-size: 13px; }
</style>
